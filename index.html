<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Workout Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2f80ed" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h1>🏋️ Workout Timer</h1>
  <div id="subtitle">音声付きインターバルトレーニング</div>

  <div id="progressContainer">
    <div id="progressText">- / -</div>
    <div id="progressBar">
      <div id="progressFill"></div>
    </div>
  </div>

  <div id="exercise">準備OK？</div>
  <div id="description">スタートを押してください</div>
  <div id="timer">00</div>

  <button id="toggleBtn" onclick="togglePause()">▶ スタート</button>
  <button onclick="stopWorkout()">⏹ ストップ</button>

  <script src="script.js"></script>
</body>
</html>
